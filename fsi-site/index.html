<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- data-pre: 画面が動き出したら、各ページのタイトル・説明に差し替わる -->
    <title data-pre>FSI-STYLE CORP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="システム開発・クラウド導入・運用保守のITソリューション企業の公式サイト。" data-pre />
    <meta name="theme-color" content="#0b2a42" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Webフォント: Noto Sans JP（本文）+ Montserrat（英字見出し・数字）
      表示を止めないよう、読み込みが終わってから適用する（それまでは端末の標準フォントで表示）。
      Google Fonts は日本語を文字の範囲ごとに分けて配信するので、ページで使う文字の分だけ読み込まれる。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
